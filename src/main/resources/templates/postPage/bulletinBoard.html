<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bulletin Board</title>
    <script src="/js/fetch.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script>
        async function fetchPosts(page = 0, category = null, keyword = null) {
            try {
                // category 또는 keyword가 null일 경우 해당 파라미터를 포함하지 않도록 URL을 구성
                let url = `/post/find/all?page=${page}&size=10`;
                if (category !== null) {
                    url += `&categoryId=${category}`;
                }
                if (keyword !== null) {
                    url += `&keyword=${keyword}`;
                }
                const response = await fetchWithAuth(url);
                if (response.ok) {
                    const data = await response.json();
                    updatePosts(data.content);
                    updatePagination(data.totalPages, page);
                } else {
                    console.error('Failed to fetch posts');
                }
            } catch (error) {
                console.error('Error fetching posts:', error);
            }
        }

        function updatePosts(posts) {
            const postsContainer = document.getElementById('postsContainer');
            postsContainer.innerHTML = '';
            posts.forEach(post => {
                const postElement = document.createElement('li');
                postElement.className = 'bg-white p-4 mb-4 rounded shadow';
                postElement.innerHTML = `
                    <h2 class="text-xl font-bold">[${post.categoryName}] ${post.title}</h2>
                    <p class="text-gray-700">작성자 : ${post.userName} / 작성일자 : ${post.createdAt.split('T')[0]}</p>
                `;
                postsContainer.appendChild(postElement);
            });
        }

        function updatePagination(totalPages, currentPage) {
            const paginationContainer = document.getElementById('paginationContainer');
            paginationContainer.innerHTML = '';
            for (let i = 0; i < totalPages; i++) {
                const pageLink = document.createElement('a');
                pageLink.href = '#';
                pageLink.innerText = i + 1;
                pageLink.className = `px-4 py-2 mx-1 rounded ${i === currentPage ? 'bg-blue-500 text-white' : 'bg-gray-300 text-black'}`;
                pageLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    fetchPosts(i);
                });
                paginationContainer.appendChild(pageLink);
            }
        }
        async function fetchAndPopulateSelect(url, selectId, idField, textField) {
            try {
                const response = await fetch(url); // API 호출
                if (!response.ok) throw new Error(`Failed to fetch ${url}`);

                const data = await response.json(); // JSON 데이터 파싱
                const select = document.getElementById(selectId);

                // 데이터로 옵션 추가
                data.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item[idField]; // valueField를 value로 설정
                    option.textContent = item[textField]; // textField를 표시
                    select.appendChild(option);
                });
            } catch (error) {
                console.error(`Error populating ${selectId}:`, error);
            }
        }
        function searchPost(event) {
            event.preventDefault();
            const categoryId = document.getElementById('category').value;
            const keyword = document.querySelector('[name="keyword"]').value;
            fetchPosts(0, categoryId, keyword);  // 0은 첫 번째 페이지
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchPosts();
            fetchAndPopulateSelect('/api/category', 'category', 'categoryId', 'categoryName');
        });
    </script>
</head>
<body class="bg-gray-100">
<div class="container mx-auto p-4">
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-3xl font-bold">Bulletin Board</h1>
        <button class="text-xl text-white bg-red-500 font-bold px-4 py-2 rounded-md">logout</button>
    </div>
    <!-- 검색 기능 -->
    <div class="flex items-center space-x-4 mb-4">
        <a href="/page/writePost" class="bg-blue-500 w-1/5 text-white text-center px-4 py-2 rounded-md">Write a Post</a>
        <select id="category" name="categoryId" class="w-1/5 p-2 border border-gray-300 rounded-md"></select>
        <input type="text" class="form-control border w-2/5 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" name="keyword" placeholder="게시글 검색어를 입력하세요" required>
        <button type="button" class="bg-blue-500 text-white w-1/5 px-4 py-2 rounded-md " onclick="searchPost(event)">
            검색
        </button>
    </div>
    <div class="mt-4">
        <ul id="postsContainer"></ul>
    </div>
    <div id="paginationContainer" class="mt-4 flex justify-center"></div>
</div>
</body>
</html>
