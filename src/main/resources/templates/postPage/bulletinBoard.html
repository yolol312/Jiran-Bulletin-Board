<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <title>Bulletin Board</title>
    <script src="/js/fetch.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script>
        async function fetchPosts(page = 0, category = null, keyword = null, isBulletin = true) {
            try {
                let url = `/post/find?page=${page}&size=10&sort=createdAt,desc&isBulletin=${isBulletin}`;
                if (category !== null) {
                    url += `&categoryId=${category}`;
                }
                if (keyword !== null) {
                    url += `&keyword=${keyword}`;
                }
                const response = await fetchWithAuth(url);
                if (response.ok) {
                    const data = await response.json();
                    updatePosts(data.content);
                    updatePagination(data.totalPages, page);
                } else {
                    console.error('Failed to fetch posts');
                }
            } catch (error) {
                console.error('Error fetching posts:', error);
            }
        }

        function updatePosts(posts) {
            const postsContainer = document.getElementById('postsContainer');
            postsContainer.innerHTML = '';
            posts.forEach(post => {
                const postElement = document.createElement('li');
                postElement.className = 'bg-white p-4 mb-4 rounded shadow';
                postElement.onclick = () => onPostClick(post.postId);
                postElement.innerHTML = `
                    <h2 class="text-xl font-bold cursor-pointer text-black-500">[${post.categoryName}] ${post.title}</h2>
                    <p class="text-gray-700">작성자 : ${post.userName} / 작성일자 : ${post.createdAt.split('T')[0]}</p>
                `;
                postsContainer.appendChild(postElement);
            });
        }

        function updatePagination(totalPages, currentPage) {
            const paginationContainer = document.getElementById('paginationContainer');
            paginationContainer.innerHTML = '';
            for (let i = 0; i < totalPages; i++) {
                const pageLink = document.createElement('a');
                pageLink.href = '#';
                pageLink.innerText = i + 1;
                pageLink.className = `px-4 py-2 mx-1 rounded ${i === currentPage ? 'bg-blue-500 text-white' : 'bg-gray-300 text-black'}`;
                pageLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    fetchPosts(i);
                });
                paginationContainer.appendChild(pageLink);
            }
        }

        async function fetchAndPopulateSelect(url, selectId, idField, textField) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Failed to fetch ${url}`);

                const data = await response.json();
                const select = document.getElementById(selectId);

                data.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item[idField];
                    option.textContent = item[textField];
                    select.appendChild(option);
                });
            } catch (error) {
                console.error(`Error populating ${selectId}:`, error);
            }
        }

        function searchPost(event) {
            event.preventDefault();
            const categoryId = document.getElementById('category').value;
            const keyword = document.querySelector('[name="keyword"]').value;
            fetchPosts(0, categoryId, keyword);
        }

        function onPostClick(postId) {
            window.location.href = `/page/view/${postId}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchPosts();
            fetchAndPopulateSelect('/api/category', 'category', 'categoryId', 'categoryName');
        });
    </script>
</head>
<body class="bg-gray-100">
<div layout:fragment="content" class="container my-3">
    <div class="container mx-auto p-4">
        <div class="flex items-center space-x-4 mb-4">
            <select id="category" name="categoryId" class="w-1/4 p-2 border border-gray-300 rounded-md"></select>
            <input type="text" class="form-control border w-2/4 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" name="keyword" placeholder="게시글 검색어를 입력하세요" required>
            <button type="button" class="bg-blue-500 text-white w-1/4 px-4 py-2 rounded-md" onclick="searchPost(event)">
                검색
            </button>
        </div>
        <div class="mt-4">
            <ul id="postsContainer"></ul>
        </div>
        <div id="paginationContainer" class="mt-4 flex justify-center"></div>
    </div>
</div>
</body>
</html>
