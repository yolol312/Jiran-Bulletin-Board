<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{common/layout}">
<head>
    <meta charset="UTF-8">
    <title>My Posts</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="/js/fetch.js"></script>
    <script>
        let userId = getUserIdFromToken();
        async function fetchMyPosts(page = 0, category = null, keyword = null) {
            try {
                let url = `/post/find/my?page=${page}&size=10&sort=createdAt,desc&userId=${userId}`;
                if (category !== null) {
                    url += `&categoryId=${category}`;
                }
                if (keyword !== null) {
                    url += `&keyword=${keyword}`;
                }
                const response = await fetchWithAuth(url);

                if (response.ok) {
                    const data = await response.json();
                    console.log(data);
                    updateMyPosts(data.content);
                } else {
                    console.error('Failed to fetch posts');
                }
            } catch (error) {
                console.error('Error fetching posts:', error);
            }
        }

        function updateMyPosts(posts) {
            const postsContainer = document.getElementById('myPostsContainer');
            postsContainer.innerHTML = '';
            posts.forEach(post => {
                const postElement = document.createElement('li');
                postElement.className = 'bg-white p-4 mb-4 rounded shadow';
                postElement.innerHTML = `
                    <h2 class="text-xl font-bold text-black-500">[${post.categoryName}] ${post.title}</h2>
                    <div class="flex justify-end gap-2 mt-2">
                        <p class="bg-gray-500 text-black-700 px-4 py-2 rounded">${post.isBulletin ? '게시된 글' : '임시 저장된 글'}</p>
                        <button class="bg-blue-500 text-white px-4 py-2 rounded" onclick="editPost(${post.postId})">수정</button>
                        <button class="bg-red-500 text-white px-4 py-2 rounded" onclick="deletePost(${post.postId})">삭제</button>
                    </div>
                `;
                postsContainer.appendChild(postElement);
            });
        }

        async function fetchAndPopulateSelect(url, selectId, idField, textField) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Failed to fetch ${url}`);

                const data = await response.json();
                const select = document.getElementById(selectId);

                data.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item[idField];
                    option.textContent = item[textField];
                    select.appendChild(option);
                });
            } catch (error) {
                console.error(`Error populating ${selectId}:`, error);
            }
        }

        function searchMyPosts(event) {
            event.preventDefault();
            const category = document.querySelector('[name="categoryId"]').value;
            const keyword = document.querySelector('[name="keyword"]').value;
            fetchMyPosts(0, category, keyword);
        }

        function editPost(postId) {
            window.location.href = `/page/writePost/${postId}`;
        }

        async function deletePost(postId) {
            if (confirm('정말로 삭제하시겠습니까?')) {
                try {
                    const response = await fetchWithAuth(`/post/writing/${postId}`, { method: 'DELETE' });
                    if (response.ok) {
                        await fetchMyPosts();
                        alert('Post deleted successfully!');
                    } else {
                        alert('Failed to delete post.');
                    }
                } catch (error) {
                    console.error('Error deleting post:', error);
                    alert('An error occurred while deleting the post.');
                }
            }
        }

        function getUserIdFromToken() {
            const token = sessionStorage.getItem('accessToken');
            if (!token) return null;

            // 토큰을 '.' 기준으로 나누어 payload 부분 추출
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/'); // JWT Base64 URL 인코딩 복원
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            // JSON 객체로 변환하여 userId 반환
            const payload = JSON.parse(jsonPayload);
            return payload.userId; // userId를 반환
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchMyPosts();
            fetchAndPopulateSelect('/api/category', 'category', 'categoryId', 'categoryName');
        });
    </script>
</head>
<body class="bg-gray-100">
<div layout:fragment="content" class="container my-3">
    <div class="container mx-auto p-6">
        <h1 class="text-3xl font-bold mb-4">내 게시글</h1>
        <div class="flex items-center space-x-4 mb-4">
            <select id="category" name="categoryId" class="w-1/4 p-2 border border-gray-300 rounded-md"></select>
            <input type="text" class="form-control border w-2/4 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" name="keyword" placeholder="게시글 검색어를 입력하세요" required>
            <button type="button" class="bg-blue-500 text-white w-1/4 px-4 py-2 rounded-md" onclick="searchMyPosts(event)">
                검색
            </button>
        </div>
        <ul id="myPostsContainer"></ul>
    </div>
</div>
</body>
</html>
