<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Post Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<div class="container mx-auto p-6">
    <h1 class="text-3xl font-bold mb-4">Post Detail</h1>

    <!-- Post Detail -->
    <div class="bg-white p-6 rounded shadow">
        <h2 class="text-2xl font-bold mb-2" th:text="${post.title}"></h2>
        <p class="text-gray-500 mb-2">
            <span th:text="'Category: ' + ${post.categoryName}"></span> |
            <span th:text="'Author: ' + ${post.userName}"></span> |
            <span th:text="'Created At: ' + ${post.createdAt}"></span>
        </p>
        <div class="text-gray-700 mt-4" th:utext="${post.content}"></div>
    </div>

    <!-- Back to List Button -->
    <div class="mt-4">
        <a href="/page/bulletinBoard" class="bg-blue-500 text-white px-4 py-2 rounded-md">Back to Bulletin Board</a>
    </div>
</div>
</body>
</html>
