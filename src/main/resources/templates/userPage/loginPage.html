<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="/js/fetch.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.0.0/jsencrypt.min.js"></script>
    <script>
        let publicKey;

        async function fetchPublicKey() {
            try {
                const response = await fetch('/auth/initLogin');
                if (response.ok) {
                    const data = await response.json();
                    publicKey = data.publicKey;
                } else {
                    console.error('Failed to fetch public key');
                }
            } catch (error) {
                console.error('Error fetching public key:', error);
            }
        }

        async function loadBulletinPage() {
            try {
                window.location.href = "/page/bulletinBoard";
            } catch (error) {
                console.error('Error fetching bulletin page:', error);
            }
        }

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const encrypt = new JSEncrypt();
            encrypt.setPublicKey(publicKey);
            const encryptedEmail = encrypt.encrypt(email);
            const encryptedPassword = encrypt.encrypt(password);

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: encryptedEmail, password: encryptedPassword }),
                });

                if (response.ok) {
                    const data = await response.json();
                    const accessToken = data.accessToken;
                    sessionStorage.setItem('accessToken', accessToken);

                    await loadBulletinPage();

                } else {
                    alert("Login failed. Please check your credentials.");
                }
            } catch (error) {
                console.error('Error logging in:', error);
                alert('Error logging in. Please try again.');
            }
        }

        window.onload = fetchPublicKey;
    </script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
<div class="w-full max-w-sm bg-white p-6 rounded shadow-lg">
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">로그인</h1>
    <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
            <label for="email" class="block text-gray-700 font-medium">Email:</label>
            <input type="text" id="email" name="email" required
                   class="w-full p-2 mt-1 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label for="password" class="block text-gray-700 font-medium">Password:</label>
            <input type="password" id="password" name="password" required
                   class="w-full p-2 mt-1 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="flex justify-between items-center">
            <button type="submit"
                    class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 rounded transition">로그인</button>
        </div>
    </form>
    <div class="mt-4 text-center">
        <button type="button" onclick="window.location.href='/page/register';"
                class="text-blue-500 hover:underline">회원가입</button>
    </div>
</div>
</body>
</html>
