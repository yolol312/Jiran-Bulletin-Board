<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="/js/fetch.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.0.0/jsencrypt.min.js"></script>
    <script>
        let publicKey;

        async function fetchPublicKey() {
            try {
                const response = await fetch('/auth/initLogin');
                if (response.ok) {
                    const data = await response.json();
                    publicKey = data.publicKey;
                } else {
                    console.error('Failed to fetch public key');
                }
            } catch (error) {
                console.error('Error fetching public key:', error);
            }
        }

        async function loadBulletinPage() {
            try {
                window.location.href = "/page/bulletinBoard";
            } catch (error) {
                console.error('Error fetching bulletin page:', error);
            }
        }

        async function handleLogin(event) {
            event.preventDefault(); // Prevent default form submission

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const encrypt = new JSEncrypt();
            encrypt.setPublicKey(publicKey);
            const encryptedEmail = encrypt.encrypt(email);
            const encryptedPassword = encrypt.encrypt(password);

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: encryptedEmail, password: encryptedPassword }),
                });

                if (response.ok) {
                    const data = await response.json();
                    const accessToken = data.accessToken;
                    sessionStorage.setItem('accessToken', accessToken);

                    await loadBulletinPage();

                } else {
                    // Handle login failure
                    alert("Login failed. Please check your credentials.");
                }
            } catch (error) {
                console.error('Error logging in:', error);
                alert('Error logging in. Please try again.');
            }
        }

        window.onload = fetchPublicKey;
    </script>
</head>
<body class="bg-gray-100">
<div class="container mx-auto p-6">
    <h1 class="text-3xl font-bold mb-4">Login</h1>
    <form onsubmit="handleLogin(event)" class="bg-white p-6 rounded shadow-md">
        <div class="mb-4">
            <label for="email" class="block text-gray-700">Email:</label>
            <input type="text" id="email" name="email" required class="w-full p-2 border border-gray-300 rounded">
        </div>
        <div class="mb-4">
            <label for="password" class="block text-gray-700">Password:</label>
            <input type="password" id="password" name="password" required class="w-full p-2 border border-gray-300 rounded">
        </div>
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Login</button>
        <button type="button" onclick="window.location.href='/page/register';" class="bg-gray-500 text-white px-4 py-2 rounded ml-2">Register</button>
    </form>
</div>
</body>
</html>
