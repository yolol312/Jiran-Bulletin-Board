<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script>
        // 서버에서 데이터 가져와 콤보박스에 추가하는 함수
        async function fetchAndPopulateSelect(url, selectId, idField, textField) {
            try {
                const response = await fetch(url); // API 호출
                if (!response.ok) throw new Error(`Failed to fetch ${url}`);

                const data = await response.json(); // JSON 데이터 파싱
                const select = document.getElementById(selectId);

                // 데이터로 옵션 추가
                data.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item[idField]; // valueField를 value로 설정
                    option.textContent = item[textField]; // textField를 표시
                    select.appendChild(option);
                });
            } catch (error) {
                console.error(`Error populating ${selectId}:`, error);
            }
        }

        // 페이지 로드 시 API 호출 및 콤보박스 채우기
        window.onload = () => {
            fetchAndPopulateSelect('/api/titles', 'title', 'titleId', 'titleName');
            fetchAndPopulateSelect('/api/positions', 'position', 'positionId', 'positionName');
            fetchAndPopulateSelect('/api/roles', 'role', 'roleId', 'roleName');
        };
    </script>
</head>
<body class="bg-gray-100">
<div class="container mx-auto p-6">
    <h1 class="text-3xl font-bold mb-4">Register</h1>
    <form action="/user/register" method="post" class="bg-white p-6 rounded shadow-md">
        <div class="mb-4">
            <label for="name" class="block text-gray-700">Name:</label>
            <input type="text" id="name" name="name" required class="w-full p-2 border border-gray-300 rounded">
        </div>
        <div class="mb-4">
            <label for="email" class="block text-gray-700">Email:</label>
            <input type="email" id="email" name="email" required class="w-full p-2 border border-gray-300 rounded">
        </div>
        <div class="mb-4">
            <label for="password" class="block text-gray-700">Password:</label>
            <input type="password" id="password" name="password" required class="w-full p-2 border border-gray-300 rounded">
        </div>
        <div class="mb-4">
            <label for="title" class="block text-gray-700">Title:</label>
            <select id="title" name="titleId" required class="w-full p-2 border border-gray-300 rounded"></select>
        </div>
        <div class="mb-4">
            <label for="position" class="block text-gray-700">Position:</label>
            <select id="position" name="positionId" required class="w-full p-2 border border-gray-300 rounded"></select>
        </div>
        <div class="mb-4">
            <label for="role" class="block text-gray-700">Role:</label>
            <select id="role" name="roleId" required class="w-full p-2 border border-gray-300 rounded"></select>
        </div>
        <div class="mb-4">
            <label for="birthDate" class="block text-gray-700">Birth Date:</label>
            <input type="date" id="birthDate" name="birthDate" required class="w-full p-2 border border-gray-300 rounded">
        </div>
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Sign Up</button>
    </form>
</div>
</body>
</html>
