<!DOCTYPE html>
<html layout:decorate="~{common/layout}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Bulletin Board</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold mb-4">Bulletin Board</h1>
    <a href="/page/writePost" class="bg-blue-500 text-white px-4 py-2 rounded">Write a Post</a>
    <div class="mt-4">
        <ul>
            <li th:each="post : ${posts}" class="bg-white p-4 mb-4 rounded shadow">
                <h2 th:text="${post.title}" class="text-xl font-bold"></h2>
                <p th:text="${post.content}" class="text-gray-700"></p>
                <a th:href="@{/post/writing/{id}(id=${post.postId})}" class="text-blue-500">Read more</a>
            </li>
        </ul>
    </div>
    <div class="mt-4">
        <div th:if="${totalPages > 1}" class="flex justify-center">
            <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
               th:href="@{/bulletin(page=${i}, size=${10})}"
               th:text="${i + 1}"
               th:classappend="${i == currentPage} ? 'bg-blue-500 text-white' : 'bg-gray-300 text-black'"
               class="px-4 py-2 mx-1 rounded"></a>
        </div>
    </div>
</div>
</body>
</html>
